name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q fieldsales.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build APK
        working-directory: fieldsales/app
        run: |
          chmod +x setup.sh
          ./setup.sh
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fieldsales-apk
          path: fieldsales/app/build/app/outputs/flutter-apk/app-release.apk
